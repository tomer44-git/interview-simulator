[pytest]
# איפה לחפש טסטים — רק בתיקיית tests
testpaths = tests

# מוסיף את backend/ ל-import path כדי ש-"from agents import ..." יעבוד
pythonpath = .

# -v   = מציג כל טסט בשמו
# --strict-markers = שגיאה אם משתמשים ב-marker שלא הוגדר כאן
# -m "not live" = מדלג כברירת מחדל על טסטים שפונים ל-API אמיתי
addopts = -v --strict-markers -m "not live"

markers =
    live: פונה ל-Tavily/Anthropic האמיתיים — עולה כסף ואוכל מכסה. הרצה: pytest -m live

# לא לסרוק את הספריות המותקנות ואת סקריפט ה-e2e הידני
norecursedirs = venv .git __pycache__ e2e node_modules
